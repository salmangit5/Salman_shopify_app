<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salman Products App</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f6f6f7; margin: 0; padding: 15px; color: #202223; }
    .navbar { background: #008060; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .navbar h1 { margin: 0; font-size: 18px; }
    .btn-add { background: white; color: #008060; border: none; padding: 10px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e1e3e5; }
    .stat-card h3 { font-size: 14px; color: #6d7175; margin: 0 0 10px; }
    .stat-card p { font-size: 26px; font-weight: bold; color: #008060; margin: 0; }
    .table-container { background: white; border-radius: 8px; border: 1px solid #e1e3e5; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px; border-bottom: 1px solid #e1e3e5; white-space: nowrap; }
    th { background: #f9fafb; color: #6d7175; }
    .badge { background: #e2f1e5; color: #108043; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    .badge.out { background: #fbeae5; color: #dd3c11; }
    .btn-delete { background: #dd3c11; color: white; border: none; padding: 7px 10px; border-radius: 4px; cursor: pointer; }
    .btn-sub { background: #008060; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>Salman Products App</h1>
    <button class="btn-add" onclick="addProduct()">+ Add Product</button>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <h3>Total Products</h3>
      <p id="total-count">3</p>
    </div>
    <div class="stat-card">
      <h3>Active Sales</h3>
      <p id="sales-count">120</p>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Status</th>
          <th>Stock</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>
  </div>

  <button class="btn-sub" onclick="createSubscription()">Subscribe Now ($5/mo)</button>

  <script>
    let products = JSON.parse(localStorage.getItem("salman_products")) || [
      { name: "Wireless Headphones", stock: 100, price: 49.99 },
      { name: "Smart Watch Series 9", stock: 50, price: 89.99 },
      { name: "Brand Men's Wallet", stock: 0, price: 19.99 }
    ];

    function saveProducts() {
      localStorage.setItem("salman_products", JSON.stringify(products));
    }

    function displayProducts() {
      const tableBody = document.getElementById("product-list");
      tableBody.innerHTML = "";
      document.getElementById("total-count").innerText = products.length;

      products.forEach((product, index) => {
        const isOut = Number(product.stock) === 0;
        tableBody.innerHTML += `
          <tr>
            <td><b>${product.name}</b></td>
            <td><span class="${isOut ? 'badge out' : 'badge'}">${isOut ? 'Out of Stock' : 'Active'}</span></td>
            <td>${product.stock} in stock</td>
            <td>$${Number(product.price).toFixed(2)}</td>
            <td><button class="btn-delete" onclick="deleteProduct(${index})">Delete</button></td>
          </tr>
        `;
      });
    }

    function addProduct() {
      let pName = prompt("Enter new product name:");
      if (!pName || !pName.trim()) return;
      let pPrice = prompt("Enter product price:", "29.99");
      if (!pPrice || isNaN(pPrice)) return alert("Valid price likhein!");
      let pStock = prompt("Enter product stock:", "10");
      if (!pStock || isNaN(pStock)) return alert("Valid stock likhein!");

      products.push({ name: pName.trim(), price: Number(pPrice), stock: Number(pStock) });
      saveProducts();
      displayProducts();
    }

    function deleteProduct(index) {
      if (confirm("Delete this product?")) {
        products.splice(index, 1);
        saveProducts();
        displayProducts();
      }
    }

    displayProducts();

    async function createSubscription() {
      const shopUrl = "salman-luxury.myshopify.com"
      const accessToken = "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";

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shop: shopUrl, accessToken: accessToken })
        });
        const result = await response.json();
        const url = result.data?.appSubscriptionCreate?.confirmationUrl;

        if (url) {
          window.top.location.href = url;
        } else {
          alert("Shopify Response: " + JSON.stringify(result));
        }
      } catch (error) {
        alert("Network Error: " + error.message);
      }
    }
  </script>
</body>
</html>
