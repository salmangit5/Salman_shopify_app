
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salman Shopify Connected App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f6f6f7;
    margin: 0;
    padding: 10px;
}

.navbar {
    background: #008060;
    color: white;
    padding: 15px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.navbar h2 {
    font-size: 19px;
    margin: 0;
}

.btn-add {
    background: white;
    color: #008060;
    border: none;
    padding: 12px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.table-container {
    background: white;
    border-radius: 8px;
    border: 1px solid #e1e3e5;
    padding: 15px;
    margin-top: 15px;
}

.status-msg {
    display: none;
    padding: 12px;
    margin-top: 15px;
    border-radius: 6px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.success {
    background: #e2f1e5;
    color: #108043;
}

.error {
    background: #fbeae5;
    color: #dd3c11;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button:disabled {
    opacity: .6;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>Salman Connected App V2</h2>
    <button class="btn-add" id="sendBtn"
        onclick="sendProductToShopify()">
        + Send to Shopify Store
    </button>
</div>

<div id="msg-box" class="status-msg"></div>

<div class="table-container">
    <h3>📡 Shopify Connection</h3>
    <p>Product upload system</p>

    <label>Product Name</label>
    <input id="productName" type="text"
        placeholder="Enter product name">

    <label>Product Price ($)</label>
    <input id="productPrice" type="number"
        min="0.01" step="0.01" value="25.00">

    <button class="btn-add" onclick="sendProductToShopify()">
        Upload Product
    </button>
</div>

<script>
async function sendProductToShopify() {

    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value;
    const btn = document.getElementById("sendBtn");

    if (!name) {
        showStatus("Please enter product name.", "error");
        return;
    }

    if (!price || !Number.isFinite(Number(price)) ||
        Number(price) <= 0) {
        showStatus("Please enter a valid price.", "error");
        return;
    }

    btn.disabled = true;
    showStatus("Connecting to Shopify... Please wait.", "success");

    try {
        const response = await fetch("/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: name,
                price: Number(price).toFixed(2)
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Product upload failed.");
        }

        showStatus(
            "Success! Product created: " + result.product.title +
            " | Price: $" + result.product.price,
            "success"
        );

        document.getElementById("productName").value = "";

    } catch (error) {
        showStatus("Error: " + error.message, "error");
    } finally {
        btn.disabled = false;
    }
}

function showStatus(message, type) {
    const box = document.getElementById("msg-box");
    box.style.display = "block";
    box.className = "status-msg " + type;
    box.textContent = message;
}
</script>

</body>
</html>
